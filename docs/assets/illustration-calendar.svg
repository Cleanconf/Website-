  <rect x="40" y="40" width="560" height="400" rx="16" fill="#ffffff" stroke="#E0E0E0"/>
  <rect x="40" y="40" width="560" height="56" rx="16" fill="#101585"/>
  <rect x="70" y="60" width="120" height="16" rx="8" fill="#ffffff"/>
